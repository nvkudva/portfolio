<!-- Stamp the saved look before first paint so the page never flashes the wrong layout. -->
<script>
  try {
    var s = JSON.parse(localStorage.getItem('vk.theme') || '{}');
    var r = document.documentElement;
    r.dataset.layout = s.layout === 'kinetic' ? 'kinetic' : 'console';
    r.dataset.skin = s.skin === 'cyber' ? 'cyber' : 'pro';
    r.dataset.mode = s.mode === 'dark' ? 'dark' : 'light';
  } catch (e) {}
</script>
